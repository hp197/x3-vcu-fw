; x3-vcu-fw -- PlatformIO build for the Segway-Ninebot x3 VCU application firmware.
; (Artery AT32F415CBT7, the vehicle-control unit; slot 0 of flash @ 0x08001000.)
;
; Built on the official Artery AT32F415 BSP (BSD-3-Clause) + CMSIS.
;
;   pio run             # build
;   pio run -t clean    # clean
;   (upload/debug are intentionally disabled -- flash via the x3 bootloader/x3utils)

[platformio]
default_envs = gt3, zt3, f3
; Optional, untracked local overrides (gitignored), e.g. [env:emu-test] custom_x3emu_dir
; pointing at an x3-vcu-emu worktree. A missing file is skipped.
extra_configs = platformio.local.ini

[boot_base]
platform  = https://github.com/ArteryTek/platform-arterytekat32.git
board     = genericAT32F415CBT7
framework = at32firmlib

; application linker: vectors at 0x08001000, 60 KB slot-0 region.
board_build.ldscript = x3-vcu-fw.ld

; the VCU app owns slot 0 (0x08001000-0x0800FFFF = 60 KB). Size-check against that.
board_upload.maximum_size = 61440

; Build id: the first 6 hex digits of the git commit into CONFIG_BUILD_ID (BLE regs
; 0xE4..0xE6); X3VCU_BUILD_ID=none leaves it unset (6 x 0xFF) for reproducible images.
extra_scripts =
    pre:tools/build_id.py
    post:tools/size_sections.py ; count .text_low / .app_header in the size check

build_flags =
    -I include
    -ffunction-sections
    -fdata-sections
    -Wall

; Project sources only (not the BSP): an undefined macro in #if is an error, so a
; VCU_HAS_FEATURE(<name>) that a model does not define fails the build instead of reading 0.
build_src_flags =
    -Werror=undef

; build-only: flash the resulting image to 0x08001000 via the bootloader / x3utils.
upload_protocol = custom
upload_command  = python -c "raise SystemExit('x3-vcu-fw is build-only: upload is disabled.')"

; No -flto: with this toolchain (GCC 7.2.1) LTO drops every C *_IRQHandler and the
; vectors fall back to the weak Default_Handler aliases from the startup asm
; (-Wl,-u and __attribute__((used)) do not prevent it). Tried 2026-11-06.
; One application environment per scooter model, on [app_base]. VCU_MODEL selects the
; model in include/model.h, which also holds the per-model feature switches. A new model:
; a block in model.h and an [env:<model>] here.
[app_base]
extends = boot_base
; The unit tests build for [env:emu-test] only (this image has main.c and no Unity).
test_ignore = *
build_flags =
    ${boot_base.build_flags}
    -Os

[env:gt3]
extends = app_base
build_flags =
    ${app_base.build_flags}
    -D VCU_MODEL=VCU_MODEL_GT3

[env:zt3]
extends = app_base
build_flags =
    ${app_base.build_flags}
    -D VCU_MODEL=VCU_MODEL_ZT3

[env:f3]
extends = app_base
build_flags =
    ${app_base.build_flags}
    -D VCU_MODEL=VCU_MODEL_F3

; On-target unit tests (Unity) run in the x3emu emulator, not on a device: test/README.md.
;   pio test -e emu-test                    # build + run every suite (test/test_*/)
;   pio test -e emu-test -f test_ninebot    # one suite
; Each test/test_<module>/ is its own image: product src/ minus main.c, the test root
; files (tst_*.c) and the suite. Unity prints over ITM port 0 and the run ends with a
; semihosting exit; `x3emu test` streams the output and maps the outcome to its exit code.
[env:emu-test]
extends = boot_base
; 120 KB image region below the identity pages (the emulator only; never flashed).
board_build.ldscript = test/emu-test.ld
board_upload.maximum_size = 122880
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.c>
; --wrap: the BSP calls the recording fakes in test/tst_bsp_fakes.c intercept.
; The spi_i2s_* wraps are the SPI2 / IMU fakes in test/tst_sensor.c.
build_flags =
    ${boot_base.build_flags}
    -Os
    -D VCU_MODEL=VCU_MODEL_GT3
    -D FFF_ARG_HISTORY_LEN=8u
    -D FFF_CALL_HISTORY_LEN=16u
    -Wl,--wrap=can_message_transmit
    -Wl,--wrap=can_receive_message_pending_get
    -Wl,--wrap=can_message_receive
    -Wl,--wrap=dma_channel_enable
    -Wl,--wrap=flash_sector_erase
    -Wl,--wrap=flash_halfword_program
    -Wl,--wrap=flash_word_program
    -Wl,--wrap=spi_i2s_data_transmit
    -Wl,--wrap=spi_i2s_data_receive
    -Wl,--wrap=spi_i2s_flag_get
; The emulator: workspace venv + the x3-vcu-emu checkout (override custom_x3emu_dir in
; platformio.local.ini to run an emulator worktree).
custom_x3emu_python = ../../.venv/bin/python
custom_x3emu_dir = ../x3-vcu-emu
test_testing_command =
    ${this.custom_x3emu_python}
    ${this.custom_x3emu_dir}
    test
    --pio
    ${platformio.build_dir}/${this.__env__}/firmware.elf
upload_command = ${this.custom_x3emu_python} -c "print('emu-test: nothing to upload, x3emu runs the image')"
